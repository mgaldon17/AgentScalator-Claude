# agentmem configuration — nested YAML, loaded by src/agentmem/config.py.
#
# Precedence: a real environment variable always wins over a value set here, which in
# turn wins over the dataclass defaults in config.py. Each "section.key" below maps to a
# flat ENV name via config._FIELD_MAP (e.g. memory.qdrant_host -> QDRANT_HOST). Point at
# a different file with AGENTMEM_CONFIG=/path/to/file.
#
# The values below restate the built-in defaults, so editing them changes behaviour from
# one place. SECRETS (API keys) do NOT live here — they sit in a gitignored `.env` and are
# referenced below as ${EMBEDDER_API_KEY} / ${LLM_API_KEY} (see `.env.example`).

# --- Qdrant / mem0 ---
memory:
  qdrant_host: localhost
  qdrant_port: 6333
  collection: agentcore_lessons
  # Namespace for mem0's identity filters; all lessons share it.
  mem_user: agentcore

# --- Embedder (cloud default: Azure OpenAI, keyless) ---
# Lessons are embedded with Azure OpenAI so they share the SAME vector space as the docs in
# Azure AI Search. `model` is the Azure DEPLOYMENT name; `base_url` is the Azure OpenAI
# resource endpoint; `dims` MUST match the model (1536 for text-embedding-3-small, 3072 for
# -large) and is written into the index. `api_key` empty => KEYLESS (DefaultAzureCredential).
# ⚠️ Use the SAME model/dims here that you pick for the docs vectorizer in the portal wizard,
# so lessons and documents live in one comparable space.
# For a fully OFFLINE stack: provider: huggingface + model: paraphrase-multilingual-MiniLM-L12-v2
# + dims: 384 (and typically rag.backend: qdrant).
embedder:
  provider: azure_openai
  model: text-embedding-3-small        # the Azure OpenAI embedding deployment name
  base_url: ""                          # e.g. https://<resource>.openai.azure.com  (fill in)
  api_key: ${EMBEDDER_API_KEY}          # empty => keyless (Entra ID)
  api_version: "2024-10-21"
  dims: 1536                            # text-embedding-3-small = 1536 (-large = 3072)
  check_reachable: false                # azure_openai is keyless; skip the http probe

# --- LLM (the ALWAYS-ON infer/rewrite of a lesson before it is stored) ---
# Every lesson is rewritten/reconciled by an LLM on write — infer is ALWAYS on and is NOT
# configurable. `backend` picks WHO does it (the chat/agent is always Claude Code; this is
# only the internal lesson-rewrite step):
#   claude — the Anthropic API, same Claude family as the agent. Key from ANTHROPIC_API_KEY.
#   local  — a local OpenAI-compatible LLM (e.g. qwen via LM Studio). Key from LLM_API_KEY.
# temperature/top_p/max_tokens apply to whichever backend is active (Anthropic ignores
# top_p when temperature is set); they never affect retrieval.
llm:
  backend: claude          # claude | local
  claude_model: claude-sonnet-5
  local_model: qwen2.5-7b-instruct-1m
  local_base_url: http://localhost:1234/v1
  temperature: 0.1
  top_p: 1.0
  max_tokens: 2000

# --- Guardrails ---
# Master switches (toggled from the control dashboard, dashboard/server.py).
guardrails:
  url_enabled: true
  destructive_enabled: true
  # Comma-separated host allowlist for browser navigation; empty = allow any host.
  allow_domains: ""
  check_reachable: true
  # Comma-separated KEYS of destructive patterns to DISABLE (empty = all active). Keys:
  # rm_root_home, mkfs, dd_to_device, redirect_to_disk, fork_bomb, force_push_main,
  # force_push_main_alt, chmod_777_root, host_shutdown.
  disabled_patterns: ""
  # JSON file of user-defined destructive rules; empty = <repo>/custom_guardrails.json.
  custom_rules_file: ""
  # URL-reachability probe (UrlGuardrail).
  probe_timeout: 5.0
  probe_user_agent: "Mozilla/5.0 (agentmem url-guardrail)"

# --- Retrieval ---
retrieval:
  search_limit: 8
  list_limit: 1000

# --- RAG / storage backend — where lessons + document knowledge live (DEFAULT: ai_search) ---
# backend switch (governs BOTH the lessons store and the document RAG):
#   ai_search — Azure AI Search (keyless). Lessons embedded locally and upserted DIRECTLY
#               (already vectorized) into the lessons index by mem0 — no blob, instant.
#               Documents loaded by a human via the Azure Portal into the docs index.
#   qdrant    — local Qdrant (offline). Lessons in the mem0 collection; documents in
#               qdrant_collection, loaded with mcp__memory__rag_ingest.
rag:
  backend: ai_search      # ai_search | qdrant
  top_k: 5
  qdrant_collection: support_docs   # qdrant backend only (documents, separate from lessons)

# --- Azure AI Search (used when rag.backend: ai_search — the default) ---
# Auth is KEYLESS (Entra ID / RBAC via DefaultAzureCredential — `az login`); no key here.
# `service` is the SEARCH SERVICE NAME (→ https://<service>.search.windows.net). Lessons are
# embedded with Azure OpenAI (see embedder.*) and written DIRECTLY by mem0 to lessons_index;
# docs_index is the PDF/Word index a human loads via the portal (integrated vectorization on
# vector_field). Keep embedder.* and the docs vectorizer on the SAME model/dims.
azure_search:
  service: rag-agentscalator      # → https://rag-agentscalator.search.windows.net
  lessons_index: agentmem-lessons
  docs_index: support-docs
  vector_field: text_vector

# --- Lessons — human-readable .md mirror ---
# Write each lesson to this project directory as "<id>.md" (frontmatter + procedure), a
# versionable copy alongside the vector store. Relative to the repo root; empty => off.
lessons:
  md_dir: lessons
